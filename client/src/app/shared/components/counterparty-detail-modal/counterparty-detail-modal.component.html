<div class="modal-content">
  <div class="modal-header">
    <button
      type="button"
      class="btn-close"
      (click)="modalRef.hide()"
      aria-label="Close"
    ></button>
  </div>
  <div class="modal-body">
    <counterparty-detail
      [profileId]="profileId"
      [counterpartyId]="counterpartyId"
      [year]="year"
      [month]="month"
    />
  </div>
</div>
