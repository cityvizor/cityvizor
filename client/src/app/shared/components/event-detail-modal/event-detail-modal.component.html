<div class="modal-content">
  <div class="modal-header">
    <button
      type="button"
      class="btn-close"
      (click)="modalRef.hide()"
      aria-label="Close"
    ></button>
  </div>
  <div class="modal-body">
    <event-detail [profile]="profile" [eventId]="eventId" [year]="year" />
  </div>
</div>
