<div class="container">
  <table>
    @for (payment of payments; track payment) {
      <tr class="budget">
        <td class="date">{{ payment.date | date: "d. M. y" }}</td>
        <td>{{ payment.amount | money: 0 : false }} Kč</td>
        <td>{{ payment.description }}</td>
      </tr>
    }
  </table>
</div>
