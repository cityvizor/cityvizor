<div class="modal-header">
  <h4 class="modal-title">Vytvořit nového správce</h4>
  <button
    type="button"
    class="btn-close"
    aria-label="Close"
    (click)="close.emit(false)"
  ></button>
</div>
<form #createUserForm="ngForm" (ngSubmit)="createUser(createUserForm)">
  <div class="modal-body">
    <div class="form-group">
      <label>Login</label>
      <input
        type="text"
        name="login"
        ngModel
        (ngModelChange)="login.next($event)"
        class="form-control"
        required
      />
      @if ((login | async) && loginExists === false) {
        <span class="help-block text-success"
          >Login {{ login | async }} je volný</span
        >
      }
      @if ((login | async) && loginExists === true) {
        <span class="help-block text-danger">Tento login je již zabraný!</span>
      }
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="text" name="email" class="form-control" ngModel />
    </div>
  </div>
  <div class="modal-footer">
    <button
      type="submit"
      class="btn btn-primary"
      [disabled]="!createUserForm.valid || loginExists"
    >
      Vytvořit
    </button>
  </div>
</form>
