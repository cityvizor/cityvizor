<div class="modal-header">
  <h4 class="modal-title">Smazat rozpočtový rok {{ currentYear }}</h4>
  <button
    type="button"
    class="btn-close"
    aria-label="Close"
    (click)="close.emit(false)"
  ></button>
</div>
<form #uploadForm="ngForm" (ngSubmit)="deleteYear()">
  <div class="modal-body">
    <p>
      Opravdu chcete nenávratě smazat rozpočtový rok {{ currentYear }} včetně
      všech dat?
    </p>
  </div>
  <div class="modal-footer">
    <button type="submit" class="btn btn-danger">
      {{ "common.delete" | translate }}
    </button>
  </div>
</form>
